<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Examora</title>

<style>
:root{--bg:#0f1226;--cd:#181c3a;--tx:#eef0ff;--mu:#8e94c0;--ac:#ffd23f;--ok:#37c98b;--er:#ff6b6b;--bd:#2a2f5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Cairo,system-ui,sans-serif;padding:14px;max-width:640px;margin:auto}
h1{font-size:34px;font-weight:900;margin:30px 0 0}.mu{color:var(--mu);font-size:14px;margin:4px 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;margin:6px 0;font:inherit}
button{width:100%;background:var(--ac);color:#1a1500;border:0;border-radius:10px;padding:12px;margin:6px 0;font:700 16px Cairo,system-ui,sans-serif}
button:disabled{opacity:.6}
button.s{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok);color:#04140c}button.er{background:var(--er);color:#2a0505}
a{color:var(--ac);cursor:pointer;display:inline-block;margin:6px 0;font-size:14px}.row{display:flex;gap:8px}.row button{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
.code{background:var(--bd);padding:2px 10px;border-radius:6px;letter-spacing:2px;font-weight:700}[data-a]{cursor:pointer}
#toast{position:fixed;top:10px;left:10px;right:10px;max-width:620px;margin:auto;background:var(--er);color:#2a0505;padding:12px 14px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 4px 20px #0009;display:none}
#toast.ok{background:var(--ok);color:#04140c}
</style></head><body><div id=app><div class=card id=ld><b>Examora</b><p class=mu>جاري التحميل...</p></div></div><div id=toast></div>
<script>
(function(){
var V='r3',A=document.getElementById('app'),tt;
function E(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
window.toast=function(t,ok){var d=document.getElementById('toast');d.textContent=t;d.className=ok?'ok':'';d.style.display='block';clearTimeout(tt);tt=setTimeout(function(){d.style.display='none'},8000)};
document.getElementById('toast').onclick=function(){this.style.display='none'};
window.__showErr=function(t){var d=document.getElementById('ld');if(d)d.innerHTML='<b>مشكلة في التحميل</b><p class=mu>'+E(t)+'</p><button onclick="location.reload()">إعادة المحاولة</button><button class=s onclick="__reset()">مسح بيانات الموقع وإعادة المحاولة</button>'};
function del(n){return new Promise(function(r){try{var q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=function(){r()};setTimeout(r,1500)}catch(e){r()}})}
/* إعادة ضبط كاملة: service workers + caches + localStorage + sessionStorage + IndexedDB + cookies */
window.__wipe=async function(){
try{var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister()}catch(e){}
try{var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j])}catch(e){}
try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}
try{var n=['firebaseLocalStorageDb','firebase-heartbeat-database','firebase-installations-database'];
if(indexedDB.databases){var l=await indexedDB.databases();l.forEach(function(d){if(d.name&&n.indexOf(d.name)<0)n.push(d.name)})}
for(var k=0;k<n.length;k++)await del(n[k])}catch(e){}
try{document.cookie.split(';').forEach(function(c){var nm=c.split('=')[0].trim();if(nm)document.cookie=nm+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'})}catch(e){}
};
window.__reset=async function(){await window.__wipe();location.replace(location.pathname+'?r='+Date.now())};
/* مسح تلقائي مرة واحدة لكل نسخة، والتطبيق بيستنى لحد ما يخلص */
window.__ready=(async function(){try{if(localStorage.getItem('ex_v')!==V){await window.__wipe();localStorage.setItem('ex_v',V)}}catch(e){}})();
if(!/^https?:/.test(location.protocol))A.innerHTML='<div class=card><b>افتح الموقع من رابط https</b><p class=mu>الملف مفتوح من الجهاز (content://)، وتسجيل الدخول مش بيشتغل كده. ارفعه على استضافة وافتح الرابط.</p></div>';
window.addEventListener('error',function(e){if(e.message&&!/ResizeObserver/.test(e.message))toast('خطأ: '+e.message)});
window.addEventListener('unhandledrejection',function(e){var r=e.reason||{};toast('خطأ: '+(r.code||'')+' '+(r.message||r))});
setTimeout(function(){__showErr('التحميل واقف. الأغلب إن النت بطيء أو شبكتك بتحجب خدمات Google. جرّب شبكة تانية أو VPN.')},70000);
})();
</script>
<script type="module">
await window.__ready;
const SRC=[
['gstatic',n=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}.js`],
['jsdelivr',n=>`https://cdn.jsdelivr.net/npm/firebase@10.12.2/${n}/+esm`],
['esm.sh',n=>`https://esm.sh/firebase@10.12.2/${n}`]];
const tmo=(p,t)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),t))]);
let FB=null;
for(let i=0;i<SRC.length&&!FB;i++){
const l=document.querySelector('#ld p');if(l)l.textContent='جاري تحميل Firebase ('+(i+1)+'/'+SRC.length+')...';
try{const f=SRC[i][1],[a,b,c]=await tmo(Promise.all([import(f('app')),import(f('auth')),import(f('firestore'))]),20000);FB={a,b,c}}catch(e){}}
if(!FB)__showErr('مقدرتش أحمّل مكتبات Firebase من أي مصدر (gstatic / jsdelivr / esm.sh). الشبكة دي بتحجبها أو النت ضعيف جداً. جرّب شبكة تانية أو VPN.');
else(function main(){
const{initializeApp}=FB.a,
{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,deleteUser}=FB.b,
{initializeFirestore,doc,getDoc,getDocs,collection,writeBatch}=FB.c;
/* ===== عدّل الإعدادات دي ===== */
const CFG={apiKey:"AIzaSyBqXYg-I3MeD8kzvmDAsLn1mW1jH1IByBA",authDomain:"n777-academy.firebaseapp.com",projectId:"n777-academy",storageBucket:"n777-academy.firebasestorage.app",messagingSenderId:"92365891681",appId:"1:92365891681:web:e9b40736680116fd1d6220"};
const ADMIN_EMAIL="admin@examora.app"; // إيميل حساب الأدمن (نفسه في قواعد Firestore)
/* ============================== */
const A=document.getElementById('app'),$=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
ph=v=>/^01[0125]\d{8}$/.test(v),ST={pending:'قيد المراجعة',active:'مفعّل',suspended:'موقوف'},
ER={'auth/email-already-in-use':'الإيميل ده مسجّل قبل كده','auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الإيميل أو الباسورد غلط','auth/user-not-found':'الإيميل أو الباسورد غلط','auth/weak-password':'الباسورد ضعيف','auth/invalid-email':'الإيميل مش صحيح','auth/too-many-requests':'محاولات كتير، استنى شوية','auth/user-disabled':'الحساب ده متعطل','auth/network-request-failed':'مفيش اتصال بالنت، أو Firebase متحجوب على الشبكة دي','auth/unauthorized-domain':'الدومين ده مش متضاف في Firebase ← Authentication ← Settings ← Authorized domains','auth/operation-not-allowed':'تسجيل الدخول بالإيميل والباسورد مش متفعّل في Firebase ← Authentication ← Sign-in method','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'مفتاح API غلط','auth/invalid-api-key':'مفتاح API غلط','permission-denied':'قواعد Firestore (Rules) رافضة العملية دي','unavailable':'Firestore مش متاح (اتصالك بـGoogle ضعيف). دوس إعادة المحاولة'},
errT=x=>ER[x?.code]||[x?.code,x?.message].filter(Boolean).join(' — ')||String(x),H={};
let auth,db,U,P,US=[],tab='pend',busy=0,mode='in';
const bar=t=>`<div class=bar><b>Examora</b><span class=mu>${t||esc(P?.name||'')} <a data-a=out>خروج</a></span></div>`,
msg=h=>A.innerHTML=bar()+`<div class=card>${h}</div>`,
tname=id=>US.find(x=>x.id==id)?.name||'—';
if(!CFG.apiKey)A.innerHTML='<div class=card><b>الإعدادات ناقصة</b><p class=mu>حط firebaseConfig في أول السكريبت، وإيميل الأدمن.</p></div>';
else if(/^https?:$/.test(location.protocol)){try{const app=initializeApp(CFG);auth=getAuth(app);db=initializeFirestore(app,{experimentalForceLongPolling:true});onAuthStateChanged(auth,u=>{U=u;if(busy)return;u?route():authView()},x=>{A.innerHTML='<div class=card><b>مشكلة في تسجيل الدخول</b><p class=mu>'+esc(errT(x))+'</p></div>'})}catch(x){A.innerHTML='<div class=card><b>مشكلة في التحميل</b><p class=mu>'+esc(errT(x))+'</p></div>'}}
A.onclick=e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;let r;
try{r=H[t.dataset.a]?.(t.dataset.i)}catch(x){return toast(errT(x))}
if(r&&r.then){const b=t.tagName=='BUTTON',o=t.textContent;if(b){t.disabled=true;t.textContent='جاري...'}
r.catch(x=>toast(errT(x))).finally(()=>{if(b&&t.isConnected){t.disabled=false;t.textContent=o}})}};
A.onchange=e=>{if(e.target.id=='r')roleUI()};
function authView(){const up=mode=='up';A.innerHTML=`<h1>Examora</h1><p class=mu>منصة الامتحانات</p><div class=card>${up?`<input id=n placeholder="الاسم بالكامل"><select id=r><option value=student>طالب<option value=teacher>مدرس</select>`:''}<input id=e type=email placeholder="الإيميل"><input id=p type=password placeholder="الباسورد">${up?`<input id=sp type=tel placeholder="رقم موبايلك"><div id=stf><input id=pp type=tel placeholder="رقم ولي الأمر"><input id=c placeholder="كود المدرس"></div><div id=tcf style="display:none"><input id=sb placeholder="المادة"></div>`:''}<button data-a=${up?'signup':'login'}>${up?'إنشاء حساب':'دخول'}</button><a data-a=mode>${up?'عندي حساب':'إنشاء حساب جديد'}</a></div><p class=mu style="text-align:center">v2.2 · <a data-a=reset>مسح بيانات الموقع وإعادة التحميل</a></p>`}
function roleUI(){const t=$('#r').value=='teacher';$('#stf').style.display=t?'none':'';$('#tcf').style.display=t?'':'none'}
H.mode=()=>{mode=mode=='up'?'in':'up';authView()};
H.reset=()=>window.__reset();
H.login=async()=>{let e=$('#e').value.trim().toLowerCase();const p=$('#p').value;if(e=='admin')e=ADMIN_EMAIL.toLowerCase();
if(!e||!p)return toast('اكتب الإيميل والباسورد');
await signInWithEmailAndPassword(auth,e,p)};
H.signup=async()=>{const g=i=>($('#'+i)?.value||'').trim(),r=g('r'),n=g('n'),e=g('e').toLowerCase(),p=$('#p').value,sp=g('sp'),pp=g('pp'),c=g('c').toUpperCase();
if(!n||!e||p.length<8)return toast('اكمل البيانات (الباسورد 8 حروف على الأقل)');
if(!ph(sp))return toast('اكتب رقم موبايل صحيح (11 رقم)');
if(r=='student'&&(!ph(pp)||pp==sp||!c))return toast('اكتب رقم ولي أمر صحيح ومختلف، وكود المدرس');
busy=1;let made=0;
try{U=(await createUserWithEmailAndPassword(auth,e,p)).user;made=1;let tid=null;
if(r=='student'){const k=await getDoc(doc(db,'codes',c));if(!k.exists())throw new Error('كود المدرس غلط');tid=k.data().tid}
const b=writeBatch(db);b.set(doc(db,'users',U.uid),{name:n,email:e,role:r,status:'pending',teacherId:tid,teacherCode:r=='student'?c:null,subject:g('sb')||null,createdAt:Date.now()});
b.set(doc(db,'private',U.uid),{phone:sp,parentPhone:r=='student'?pp:null});await b.commit()}
catch(x){if(made){try{await deleteUser(U)}catch(_){try{await signOut(auth)}catch(_){}}}busy=0;U=null;return toast(errT(x))}
busy=0;await route()};
H.out=()=>signOut(auth);H.retry=()=>route();
async function route(){try{if(U.email.toLowerCase()==ADMIN_EMAIL.toLowerCase())return await adminHome();
const s=await getDoc(doc(db,'users',U.uid));if(!s.exists())return msg('بيانات الحساب مش مكتملة. اتواصل مع الإدارة.');P=s.data();
if(P.status=='pending')return msg(`حسابك قيد المراجعة ⏳<br><span class=mu>هنتواصل مع ${P.role=='student'?'ولي أمرك':'حضرتك'} لتأكيد الحساب وتفعيله.</span>`);
if(P.status!='active')return msg('الحساب موقوف. اتواصل مع الإدارة.');
msg(P.role=='teacher'?`أهلاً ${esc(P.name)} ✅<p>كودك للطلاب: <span class=code>${esc(P.code||'—')}</span></p><p class=mu>المحاضرات هتتضاف في الخطوة الجاية.</p>`:`أهلاً ${esc(P.name)} ✅<p class=mu>المحاضرات هتظهر هنا.</p>`)}
catch(x){msg('<b>مشكلة في تحميل بيانات حسابك</b><p class=mu>'+esc(errT(x))+'</p><button data-a=retry>إعادة المحاولة</button>')}}
/* ===== الأدمن ===== */
async function adminHome(){US=(await getDocs(collection(db,'users'))).docs.map(d=>({id:d.id,...d.data()}));await adminView()}
const row=u=>`<div class=card data-a=open data-i=${u.id}><b>${esc(u.name)}</b><p class=mu>${ST[u.status]} · ${u.role=='student'?'المدرس: '+esc(tname(u.teacherId)):esc(u.subject||'')}</p></div>`,
card=(u,pv)=>`<div class=card><b>${esc(u.name)}</b> <span class=mu>(${u.role=='student'?'طالب':'مدرس'})</span><p class=mu>${esc(u.email)}${u.role=='student'?' · المدرس: '+esc(tname(u.teacherId)):u.subject?' · '+esc(u.subject):''}</p>${pv.phone?`<p>الموبايل: <a href="tel:${esc(pv.phone)}">${esc(pv.phone)}</a></p>`:''}${pv.parentPhone?`<p>ولي الأمر: <a href="tel:${esc(pv.parentPhone)}">${esc(pv.parentPhone)}</a></p>`:''}<p class=mu>الحالة: ${ST[u.status]}${u.code?' · الكود: '+esc(u.code):''}</p><div class=row>${u.status!='active'?`<button class=ok data-a=set data-i="${u.id}|active">تفعيل</button>`:''}${u.status!='suspended'?`<button class=er data-a=set data-i="${u.id}|suspended">${u.status=='pending'?'رفض':'إيقاف'}</button>`:''}</div></div>`;
async function adminView(){const pend=US.filter(u=>u.status=='pending'),T=US.filter(u=>u.role=='teacher'),S=US.filter(u=>u.role=='student');
let h=bar('الأدمن')+`<div class=row>${[['pend','انتظار ('+pend.length+')'],['tch','مدرسين ('+T.length+')'],['stu','طلاب ('+S.length+')']].map(([k,l])=>`<button class="${tab==k?'':'s'}" data-a=tab data-i=${k}>${l}</button>`).join('')}</div>`;
if(tab=='pend'){const pv=await Promise.all(pend.map(u=>getDoc(doc(db,'private',u.id))));h+=pend.map((u,i)=>card(u,pv[i].data()||{})).join('')||'<p class=mu>مفيش طلبات انتظار</p>'}
if(tab=='tch')h+=T.map(t=>`<div class=card data-a=open data-i=${t.id}><b>${esc(t.name)}</b> <span class=code>${esc(t.code||'—')}</span><p class=mu>${esc(t.subject||'')} · ${ST[t.status]} · ${S.filter(s=>s.teacherId==t.id).length} طالب</p></div>`).join('');
if(tab=='stu')h+=S.map(row).join('');A.innerHTML=h}
H.tab=t=>{tab=t;return adminView()};H.back=()=>adminView();
H.open=async id=>{const u=US.find(x=>x.id==id),pv=(await getDoc(doc(db,'private',id))).data()||{};

H.set=async v=>{const[id,st]=v.split('|'),u=US.find(x=>x.id==id),b=writeBatch(db),pt={status:st};
if(st=='active'&&u.role=='teacher'&&!u.code){const c=Math.random().toString(36).slice(2,7).toUpperCase();pt.code=c;b.set(doc(db,'codes',c),{tid:id})}
b.update(doc(db,'users',id),pt);await b.commit();Object.assign(u,pt);await adminView()};
})();
</script></body></html>
