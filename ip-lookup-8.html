<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رادار IP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04162e;--bg2:#0a2b57;--line:#4fa8ff;--glow:#7fe3ff;--card:rgba(6,28,58,.72);--bd:rgba(110,190,255,.22);--tx:#e6f3ff;--mut:#8fb4d9;--err:#ff8a8a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--tx);background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;padding:16px 14px 40px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:560px;margin:0 auto}
h1{font-size:26px;font-weight:800;text-align:center;letter-spacing:.5px;margin:10px 0 14px;text-shadow:0 0 18px rgba(127,227,255,.5)}
.sb{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;backdrop-filter:blur(6px)}
.sb form{display:flex;gap:6px}
.sb input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:600 17px/1 ui-monospace,Menlo,monospace;padding:14px 12px;direction:ltr;text-align:left}
.sb input::placeholder{color:var(--mut);font-family:'Cairo';direction:rtl}
.sb button{background:linear-gradient(135deg,#1f7bff,#20c6ff);border:0;color:#02142b;font:800 15px 'Cairo';padding:0 20px;border-radius:10px;cursor:pointer}
.sb button.alt{background:rgba(20,70,130,.55);color:var(--tx);border:1px solid var(--bd)}
.sb button:focus-visible,.sb input:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.chip.clr{background:rgba(120,20,30,.4);border-color:rgba(255,138,138,.4);color:var(--err);font-family:'Cairo',sans-serif}
.wire{position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:rgba(110,190,255,.18);overflow:hidden;border-radius:2px}
.wire::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--glow),transparent);left:-30%;opacity:0}
.busy .wire::after{opacity:1;animation:run 1s linear infinite}
@keyframes run{to{left:100%}}
#hist{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:rgba(20,70,130,.45);border:1px solid var(--bd);color:var(--tx);font:600 12px ui-monospace,monospace;padding:5px 10px;border-radius:99px;cursor:pointer;direction:ltr}
#out{margin-top:14px}
.err{background:rgba(120,20,30,.35);border:1px solid rgba(255,138,138,.4);color:var(--err);padding:14px;border-radius:12px;font-weight:600;line-height:1.7}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;backdrop-filter:blur(6px)}
.flag{font-size:56px;line-height:1.1}
.ip{font:800 26px ui-monospace,Menlo,monospace;direction:ltr;word-break:break-all;margin:6px 0;color:var(--glow)}
.loc{font-size:16px;color:var(--tx);line-height:1.6}
.sec{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;backdrop-filter:blur(6px)}
.sec h2{font-size:13px;font-weight:600;color:var(--mut);padding:10px 0 2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(110,190,255,.1)}
.row:last-child{border:0}
.row span:first-child{color:var(--mut);flex:none}
.row span:last-child{font-weight:600;text-align:left;direction:ltr;word-break:break-word}
.map{position:relative;margin-top:12px;height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#06182f}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;filter:invert(1) hue-rotate(195deg) saturate(.7) brightness(.8) contrast(1.15);opacity:.75}
.map::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(4,22,46,.85) 100%),repeating-linear-gradient(0deg,rgba(127,227,255,.06) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(127,227,255,.06) 0 1px,transparent 1px 28px)}
.sweep{position:absolute;z-index:2;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:conic-gradient(from 0deg,rgba(127,227,255,.35),transparent 22%);animation:sw 4s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes sw{to{transform:rotate(360deg)}}
.ring{position:absolute;z-index:3;left:50%;top:50%;border:1.5px solid var(--glow);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:rg 3s ease-out infinite}
.ring:nth-of-type(2){animation-delay:1s}.ring:nth-of-type(3){animation-delay:2s}
@keyframes rg{0%{width:8px;height:8px;opacity:.9}100%{width:220px;height:220px;opacity:0}}
.dot{position:absolute;z-index:4;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--glow);box-shadow:0 0 0 4px rgba(127,227,255,.25),0 0 22px var(--glow)}
.cross{position:absolute;z-index:3;background:rgba(127,227,255,.35)}
.cross.h{left:0;right:0;top:50%;height:1px}.cross.v{top:0;bottom:0;left:50%;width:1px}
.cn{position:absolute;z-index:5;width:22px;height:22px;border:2px solid var(--glow)}
.cn.a{top:10px;right:10px;border-left:0;border-bottom:0}.cn.b{top:10px;left:10px;border-right:0;border-bottom:0}
.cn.c{bottom:10px;right:10px;border-left:0;border-top:0}.cn.d{bottom:10px;left:10px;border-right:0;border-top:0}
.hud{position:absolute;z-index:5;bottom:14px;left:50%;transform:translateX(-50%);font:600 12px ui-monospace,monospace;color:var(--glow);direction:ltr;background:rgba(4,22,46,.75);padding:3px 10px;border-radius:6px;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;text-decoration:none;background:rgba(20,70,130,.5);border:1px solid var(--bd);color:var(--tx);font:600 14px 'Cairo';padding:12px;border-radius:12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.sweep,.ring,.busy .wire::after{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
<h1>رادار IP</h1>
<div class="sb" id="sb">
<form id="f"><input id="q" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="submit">بحث</button><button type="button" class="alt" id="me">IP بتاعي</button></form>
<div class="wire"></div>
</div>
<div id="hist"></div>
<div id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s);
/* ---------- Background: PCB traces + travelling light pulses ---------- */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,paths=[],pulses=[],speed=1,tgt=1;
const G=24;
function build(){W=cv.width=innerWidth;H=cv.height=innerHeight;paths=[];
 const n=Math.ceil(W*H/22000);
 for(let i=0;i<n;i++){let x=Math.round(Math.random()*W/G)*G,y=Math.round(Math.random()*H/G)*G,pts=[[x,y]],h=Math.random()<.5;
  const k=3+Math.floor(Math.random()*5);
  for(let j=0;j<k;j++){const d=(Math.random()<.5?-1:1)*(2+Math.floor(Math.random()*7))*G;h?x+=d:y+=d;pts.push([x,y]);h=!h}
  let L=0;const seg=[];for(let j=1;j<pts.length;j++){const l=Math.abs(pts[j][0]-pts[j-1][0])+Math.abs(pts[j][1]-pts[j-1][1]);seg.push(l);L+=l}
  paths.push({pts,seg,L})}
 pulses=[];for(let i=0;i<Math.ceil(n*.6);i++)pulses.push(np());
}
function np(){return{p:paths[Math.floor(Math.random()*paths.length)],d:0,v:.6+Math.random()*1.2}}
function at(p,d){let i=0;while(i<p.seg.length-1&&d>p.seg[i]){d-=p.seg[i];i++}const a=p.pts[i],b=p.pts[i+1],t=Math.min(1,d/p.seg[i]);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function draw(){
 speed+=(tgt-speed)*.05;cx.clearRect(0,0,W,H);
 cx.lineWidth=1.2;cx.strokeStyle='rgba(79,168,255,.16)';cx.fillStyle='rgba(79,168,255,.3)';
 for(const p of paths){cx.beginPath();p.pts.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();
  for(const e of [p.pts[0],p.pts[p.pts.length-1]]){cx.beginPath();cx.arc(e[0],e[1],3,0,7);cx.fill()}}
 for(let i=0;i<pulses.length;i++){const u=pulses[i];u.d+=u.v*speed;if(u.d>u.p.L){pulses[i]=np();continue}
  for(let t=0;t<14;t++){const dd=u.d-t*3;if(dd<0)break;const q=at(u.p,dd);
   cx.fillStyle=`rgba(127,227,255,${(1-t/14)*.9})`;cx.beginPath();cx.arc(q[0],q[1],2.6-t*.12,0,7);cx.fill()}}
 requestAnimationFrame(draw)}
addEventListener('resize',build);build();
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)draw();else{tgt=0;draw()}

/* ---------- Helpers ---------- */
const v4=/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;
const v6=/^[0-9a-f:]+$/i;
function valid(ip){if(v4.test(ip))return 4;if(ip.includes(':')&&v6.test(ip)&&(ip.match(/:/g)||[]).length>=2&&ip.length<=45)return 6;return 0}
function priv(ip){if(v4.test(ip)){const[a,b]=ip.split('.').map(Number);return a===10||a===127||a===0||(a===172&&b>=16&&b<=31)||(a===192&&b===168)||(a===169&&b===254)||(a===100&&b>=64&&b<=127)||a>=224}
 const l=ip.toLowerCase();return l==='::1'||l==='::'||l.startsWith('fe80')||l.startsWith('fc')||l.startsWith('fd')}
const to=(u,ms=8000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).finally(()=>clearTimeout(t))};
const s=x=>x==null?'':String(x).trim();
const asnN=x=>{const m=s(x).match(/\d+/);return m?m[0]:''};
const num=x=>{const n=parseFloat(x);return isFinite(n)?n:null};

/* ---------- Data sources (normalized) ---------- */
function srcs(ip){const i=ip||'';return[
 ()=>to(`https://ipwho.is/${i}`).then(d=>{if(d.success===false)throw 0;return{ip:d.ip,type:d.type,continent:d.continent,cc:d.country_code,region:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,isp:d.connection&&d.connection.isp,org:d.connection&&d.connection.org,asn:d.connection&&d.connection.asn,domain:d.connection&&d.connection.domain,tz:d.timezone&&d.timezone.id,capital:d.capital,calling:d.calling_code&&'+'+d.calling_code,currency:d.currency&&d.currency.code}}),
 ()=>to(`https://api.ipapi.is/?q=${i}`).then(d=>{if(!d.ip||d.error)throw 0;const l=d.location||{};return{ip:d.ip,cc:l.country_code,region:l.state,city:l.city,zip:l.zip,lat:l.latitude,lon:l.longitude,tz:l.timezone,continent:l.continent,isp:d.company&&d.company.name,org:d.asn&&d.asn.org,asn:d.asn&&d.asn.asn,domain:(d.asn&&d.asn.domain)||(d.company&&d.company.domain),flags:{mobile:d.is_mobile,vpn:d.is_vpn,proxy:d.is_proxy,dc:d.is_datacenter,tor:d.is_tor}}}),
 ()=>to(`https://ipapi.co/${i?i+'/':''}json/`).then(d=>{if(d.error||!d.ip)throw 0;return{ip:d.ip,type:d.version,continent:d.continent_code,cc:d.country_code,region:d.region,city:d.city,zip:d.postal,lat:d.latitude,lon:d.longitude,org:d.org,asn:d.asn,tz:d.timezone,capital:d.country_capital,calling:d.country_calling_code,currency:d.currency}}),
 ()=>to(`https://freeipapi.com/api/json/${i}`).then(d=>{if(!d.ipAddress)throw 0;return{ip:d.ipAddress,type:d.ipVersion&&'IPv'+d.ipVersion,cc:d.countryCode,region:d.regionName,city:d.cityName,zip:d.zipCode,lat:d.latitude,lon:d.longitude,tz:d.timeZone,continent:d.continent}}),
 ()=>to(`https://get.geojs.io/v1/ip/geo/${i}.json`.replace('geo/.json','geo.json')).then(d=>{if(!d.ip)throw 0;return{ip:d.ip,cc:d.country_code,region:d.region,city:d.city,lat:d.latitude,lon:d.longitude,tz:d.timezone,org:d.organization_name,asn:d.asn}}),
 ()=>to(`https://ipinfo.io/${i?i+'/':''}json`).then(d=>{if(!d.ip||d.bogon)throw 0;const lo=(d.loc||',').split(',');return{ip:d.ip,cc:d.country,region:d.region,city:d.city,zip:d.postal,lat:lo[0],lon:lo[1],tz:d.timezone,org:d.org&&d.org.replace(/^AS\d+\s*/,''),asn:asnN(d.org),domain:d.hostname}})
]}
function ptr(ip){let n;if(v4.test(ip))n=ip.split('.').reverse().join('.')+'.in-addr.arpa';else{if(ip.includes('::')){const[a,b]=ip.split('::');const A=a?a.split(':'):[],B=b?b.split(':'):[];ip=[...A,...Array(8-A.length-B.length).fill('0'),...B].join(':')}
 n=ip.split(':').map(x=>x.padStart(4,'0')).join('').split('').reverse().join('.')+'.ip6.arpa'}
 return to(`https://dns.google/resolve?name=${n}&type=PTR`,6000).then(d=>d.Answer&&d.Answer[0]?d.Answer[0].data.replace(/\.$/,''):'').catch(()=>'')}
const rc=cc=>to(`https://restcountries.com/v3.1/alpha/${cc}?fields=capital,currencies,idd,continents,latlng,area`,6000).then(d=>{d=Array.isArray(d)?d[0]:d;const c=d.currencies?Object.keys(d.currencies)[0]:'';return{center:d.latlng,area:d.area,capital:d.capital&&d.capital[0],currency:c&&`${c} - ${d.currencies[c].name}`,calling:d.idd&&d.idd.root?d.idd.root+(d.idd.suffixes&&d.idd.suffixes.length===1?d.idd.suffixes[0]:''):'',continent:d.continents&&d.continents[0]}}).catch(()=>({}));

/* ---------- Consensus ---------- */
function vote(list,key,norm=x=>x.toLowerCase()){const m=new Map();list.forEach((r,idx)=>{const v=s(r[key]);if(!v)return;const k=norm(v);const e=m.get(k)||{v,n:0,f:idx};e.n++;m.set(k,e)});
 let b=null;for(const e of m.values())if(!b||e.n>b.n||(e.n===b.n&&e.f<b.f))b=e;return b?b.v:''}
const CONT={AF:'Africa',AN:'Antarctica',AS:'Asia',EU:'Europe',NA:'North America',OC:'Oceania',SA:'South America'};
const median=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor((a.length-1)/2)]:null};
async function merge(res){
 const cc=vote(res,'cc',x=>x.toUpperCase()).toUpperCase();
 const inC=res.filter(r=>s(r.cc).toUpperCase()===cc);
 const city=vote(inC,'city');
 const inCity=inC.filter(r=>s(r.city).toLowerCase()===city.toLowerCase());
 const base=inCity.length?inCity:inC;
 const lats=base.map(r=>num(r.lat)).filter(x=>x!=null),lons=base.map(r=>num(r.lon)).filter(x=>x!=null);
 const extra=cc?await rc(cc):{};
 const cont0=vote(res,'continent');
 const o={ip:vote(res,'ip'),cc,city,
  region:vote(inC,'region'),zip:vote(inC,'zip'),
  lat:median(lats),lon:median(lons),
  isp:vote(res,'isp'),org:vote(res,'org'),
  asn:vote(res,'asn',asnN),domain:vote(res,'domain'),tz:vote(res,'tz',x=>x),
  capital:vote([...res,extra],'capital'),
  calling:vote([...res,extra],'calling',x=>x.replace(/\D/g,'')),
  currency:extra.currency||vote(res,'currency'),
  continent:extra.continent||(CONT[cont0]||cont0)};
 o.asn=o.asn?'AS'+asnN(o.asn):'';
 o.center=extra.center||(o.lat!=null?[o.lat,o.lon]:null);
 o.span=extra.area?Math.min(40,Math.max(3,Math.sqrt(extra.area)/111*1.5)):8;
 const f=(res.find(r=>r.flags)||{}).flags;
 const MOB=/\b(mobile|wireless|cellular|lte|gsm|4g|5g)\b/i,DC=/(hosting|cloud|datacenter|data center|amazon|aws|google llc|microsoft|digitalocean|ovh|hetzner|linode|vultr|cloudflare|server)/i;
 const nm=r=>s(r.isp)+' '+s(r.org),win=s(o.isp)+' '+s(o.org),fl=f||{};
 const mob=fl.mobile||MOB.test(win)||res.filter(r=>MOB.test(nm(r))).length>=2;
 const dc=fl.dc||DC.test(win)||res.filter(r=>DC.test(nm(r))).length>=2;
 o.net=fl.tor?'Tor':fl.vpn?'VPN':fl.proxy?'بروكسي':dc?'مركز بيانات / سحابة':mob?'شبكة موبايل (خلوي)':(f&&win.trim()?'خط أرضي (سكني / تجاري)':'');
 return o}

/* ---------- Render ---------- */
const flag=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt())):'🌐';
function cname(cc){try{return new Intl.DisplayNames(['ar'],{type:'region'}).of(cc)}catch(e){return cc}}
function offset(tz){try{const p=new Intl.DateTimeFormat('en',{timeZone:tz,timeZoneName:'longOffset'}).formatToParts(new Date()).find(x=>x.type==='timeZoneName');return p.value==='GMT'?'UTC+00:00':p.value.replace('GMT','UTC')}catch(e){return''}}
function ltime(tz){try{return new Date().toLocaleString('en-GB',{timeZone:tz,dateStyle:'medium',timeStyle:'medium'})}catch(e){return''}}
let tick;
function render(o,type,rdns){
 const cn=o.cc?cname(o.cc):'';
 const place=[o.city,o.region,cn].filter((x,i,a)=>x&&a.indexOf(x)===i).join('، ');
 const dom=o.domain||rdns;
 const G1=[['النوع',type],['الدولة',cn&&`${cn} (${o.cc})`],['المنطقة',o.region],['المدينة',o.city],['القارة',o.continent],['العاصمة',o.capital]];
 const G2=[['مزود الخدمة (ISP)',o.isp],['المؤسسة',o.org],['ASN',o.asn],['الدومين',dom],['طبيعة الشبكة',o.net]];
 const G3=[['المنطقة الزمنية',o.tz],['التوقيت المحلي',o.tz&&`<b id="lt">${ltime(o.tz)}</b>`],['فرق التوقيت عن UTC',o.tz&&offset(o.tz)],['العملة',o.currency],['كود الاتصال الدولي',o.calling&&(String(o.calling).startsWith('+')?o.calling:'+'+o.calling)]];
 const sec=(t,g)=>{const r=g.filter(x=>x[1]).map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('');return r?`<div class="sec"><h2>${t}</h2>${r}</div>`:''};
 let map='';
 if(o.center){const[la,lo]=o.center,dx=o.span*1.1,dy=o.span*.7;map=`<div class="map"><iframe loading="lazy" title="map" src="https://www.openstreetmap.org/export/embed.html?bbox=${lo-dx},${la-dy},${lo+dx},${la+dy}&layer=mapnik"></iframe><div class="sweep"></div><div class="cross h"></div><div class="cross v"></div><i class="ring"></i><i class="ring"></i><i class="ring"></i><div class="cn a"></div><div class="cn b"></div><div class="cn c"></div><div class="cn d"></div><div class="hud">${cn}</div></div>
 <div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(new Intl.DisplayNames(['en'],{type:'region'}).of(o.cc))}">افتح في خرائط جوجل</a><button class="btn" id="cp" type="button">نسخ النتيجة</button></div>`}
 else map=`<div class="acts"><button class="btn" id="cp" type="button">نسخ النتيجة</button></div>`;
 $('#out').innerHTML=`<div class="hero"><div class="flag">${flag(o.cc)}</div><div class="ip">${o.ip}</div><div class="loc">${place||'—'}</div></div>${sec('الموقع',G1)}${sec('الشبكة',G2)}${sec('الوقت والعملة',G3)}${map}`;
 clearInterval(tick);if(o.tz)tick=setInterval(()=>{const e=$('#lt');if(e)e.textContent=ltime(o.tz)},1000);
 $('#cp').onclick=e=>{const t=[['IP',o.ip],...G1,...G2,...G3].filter(x=>x[1]).map(x=>`${x[0]}: ${String(x[1]).replace(/<[^>]+>/g,'')}`).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{e.target.textContent='تم النسخ'},()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');e.target.textContent='تم النسخ'}catch(x){}a.remove()});
  setTimeout(()=>e.target.textContent='نسخ النتيجة',1800)}}
const err=m=>{$('#out').innerHTML=`<div class="err">${m}</div>`};

/* ---------- History ---------- */
let H_=[];try{H_=JSON.parse(localStorage.getItem('ipH')||'[]')}catch(e){}
function hist(add){if(add){H_=[add,...H_.filter(x=>x!==add)].slice(0,8);try{localStorage.setItem('ipH',JSON.stringify(H_))}catch(e){}}
 $('#hist').innerHTML=H_.map(x=>`<button class="chip" type="button">${x}</button>`).join('')+(H_.length?'<button class="chip clr" id="clr" type="button">مسح السجل</button>':'');
 document.querySelectorAll('.chip:not(.clr)').forEach(c=>c.onclick=()=>{$('#q').value=c.textContent;go()});
 const cl=$('#clr');if(cl)cl.onclick=()=>{H_=[];try{localStorage.removeItem('ipH')}catch(e){}hist()}}

/* ---------- Search ---------- */
let busy=false;
async function go(){
 if(busy)return;let ip=$('#q').value.trim();
 if(ip){const k=valid(ip);if(!k)return err('الـ IP غير صحيح. اكتب عنوان IPv4 مثل 8.8.8.8 أو IPv6 مثل 2001:4860:4860::8888.');
  if(priv(ip))return err('ده IP خاص أو محلي، ومالوش موقع على الإنترنت. جرّب IP عام.')}
 if(!navigator.onLine)return err('مفيش اتصال بالإنترنت. اتأكد من النت وجرّب تاني.');
 busy=true;$('#sb').classList.add('busy');tgt=5;$('#out').innerHTML='';
 try{
  const [rs,pt]=await Promise.all([Promise.allSettled(srcs(ip).map(f=>f())),ip?ptr(ip):Promise.resolve('')]);
  const ok=rs.filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!ok.length){err(navigator.onLine?'مفيش نتيجة للـ IP ده، أو الخدمات مش بترد دلوقتي. جرّب بعد شوية.':'مفيش اتصال بالإنترنت.');return}
  const o=await merge(ok);
  if(!o.cc&&!o.city&&!o.isp&&!o.org)return err('مفيش نتيجة للـ IP ده.');
  const type=vote(ok,'type',x=>x.replace(/^ipv/i,'').toLowerCase());
  const t=/^(4|ipv4)$/i.test(type)||v4.test(o.ip)?'IPv4':'IPv6';
  const rd=ip?pt:await ptr(o.ip);
  render(o,t,rd);hist(o.ip);
 }catch(e){err('حصل خطأ غير متوقع. جرّب تاني.')}
 finally{busy=false;$('#sb').classList.remove('busy');tgt=1}}
$('#f').addEventListener('submit',e=>{e.preventDefault();go()});
$('#me').onclick=()=>{$('#q').value='';go()};
hist();
</script>
</body>
</html>
