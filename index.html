<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--primary)"/><rect x="18" y="16" width="7" height="32" rx="3.5" fill="var(--on-primary)"/><rect x="18" y="16" width="26" height="7" rx="3.5" fill="var(--on-primary)"/><rect x="18" y="28.5" width="20" height="7" rx="3.5" fill="var(--on-primary)"/><rect x="18" y="41" width="26" height="7" rx="3.5" fill="var(--on-primary)"/><circle cx="46" cy="46" r="11" fill="var(--accent)" stroke="var(--primary)" stroke-width="3"/><path d="M41.2 46.4l3.3 3.3 6.2-7.4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name">Examora</span>
  </div>
  <div class="tools">
    <button class="toggle" id="th" type="button"></button>
    <button class="toggle" id="lo" type="button" hidden aria-label="خروج"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</header>
<main id="app"><p class="muted center">جاري التحميل…</p></main>
</div>
<div id="toast" role="status"></div>
<script>setTimeout(function(){if(!window.__booted)document.getElementById("app").innerHTML='<p class="center err">تعذّر تحميل الموقع. تأكد من الإنترنت وأعد فتح الصفحة.</p>'},9000)</script>
<script type="module" src="app.js"></script>
</body>
</html>
